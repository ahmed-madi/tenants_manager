[project]
name = "tenants_manager"
authors = [
    { name = "opinov8", email = "ahmad@opinov8.com"}
]
description = "Multi-Tenants Systems Manager"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "openai~=1.60.2",
    "boto3~=1.34.162",
    "python-dotenv~=1.0.1",
    "spire.doc~=13.1.0",
    "pdf2image~=1.17.0",
    "pillow~=10.3.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
